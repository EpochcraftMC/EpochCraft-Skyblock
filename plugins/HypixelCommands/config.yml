# DeluxeCommands v1.9.0 主配置
# 由 extended_clip 创建
# 
# 在下面创建命令！
# 命令格式如下：
# 
# commands:
#   <不带斜杠的命令>:
#     permission: <使用命令所需的权限>
#     no_permission_message: <玩家没有权限时发送的消息>
#     message:
#     - '[text]<如果以 [text] 标识开头，则此处为普通文本>'
#     - '[playercommand] spawn'
#     - '[consolecommand] eco give %executor% 100'
#     - '{"text": "此处为 JSON 文本"}'
#     - '{"text": "要在同一行有多个 JSON 组件"}&&{"text": "必须在它们之间使用 && 运算符！"}'
#     target_permission: <使用带玩家参数的命令所需的权限: /<命令> (玩家)>
#     target_no_permission_message: <玩家没有权限指定目标来设置占位符时发送的消息>
#     target_message:
#     - '[text]<你不需要指定此选项，仅当你想在指定目标时发送单独消息才需要>'
#     - '{"text": "%player% 的统计信息:"}'
#     - '{"text": "此消息仅在命令中指定了目标玩家时才发送！"}'
#     aliases:
#     - 'somealiasforthiscommand'
# 
# 你现在可以添加新条目来为每个命令定义不同的别名！
#  只需将 "aliases" 选项添加到你想定义别名的命令上！
# DeluxeCommands 会检测你是否安装了 DeluxeChat 或 PlaceholderAPI！你可以使用任何已启用的占位符！
