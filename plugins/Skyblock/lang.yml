menus:
  profile:
    title: 你的空岛生存个人资料
    head:
      nameItem: '&a您的空岛生存个人资料'
      loreItem: |-
        &7  &c生命 &f%us_health%
        &7  &a防御 &f%us_defense%
        &7  &c强度 &f%us_force%
        &7  &f速度 &f%us_speed%
        &7  &9暴击几率 &f%us_critchance%
        &7  &9暴击伤害 &f%us_critdamage%
        &7  &b情报 &f%us_intelligence%
    health:
      nameItem: '&c血量 &f%us_health%'
      loreItem: |-
        &7血量是您的总最大值
        &7血量.您的自然
        &7再生给予 &a%us_regen_health%
        &7每次.
        &7
        &7基本运行状况: &a%us_health_simple%
        &7  &8&o通过以下方式增加您的基本生命值
        &7  &8&o平整你的农业和
        &7  &8&o钓鱼技巧和 &dFairy&8&o.
        &7
        &7奖励血量: &8+&e%us_health_armor%
        &7  &8&o增加您的奖励血量
        &7  &8&o通过装备装甲和持甲
        &7  &8&o物品栏中的护身符.
    defense:
      nameItem: '&a防御 &f%us_defense%'
      loreItem: |-
        &7防御可以减少你受到的
        &7来自敌人的伤害.
        &7
        &7基础防御: &a%us_defense_simple%
        &7  &8&o通过升级你的挖掘
        &7  &8&o技能和 &d仙女&8&o
        &7  &8&o来增加你的基础防御.
        &7
        &7奖励防御: &8+&e%us_defense_armor%
        &7  &8&o通过装备护甲和持有
        &7  &8&o护身符来增加你的
        &7  &8&o奖励防御.
    force:
      nameItem: '&c强度 &f%us_force%'
      loreItem: |-
        &7强度可以增加你的基础
        &7近战伤害，包括徒手
        &7和武器攻击.
        &7
        &7基础强度: &a%us_force_simple%
        &7  &8&o通过升级你的砍伐和
        &7  &8&o钓鱼技能和 &d仙女&8&o
        &7  &8&o来增加你的基础强度.
        &7
        &7奖励强度: &8+&e%us_force_armor%
        &7  &8&o通过装备护甲和持有
        &7  &8&o护身符来增加你的
        &7  &8&o奖励强度.
    speed:
      nameItem: '&f速度 &f%us_speed%'
      loreItem: |-
        &7速度可以增加你的行走速度.
        &7
        &7基础速度: &a%us_speed_simple%
        &7  &8&o通过 &d仙女&8&o
        &7  &8&o来增加你的基础
        &7  &8&o速度.
        &7
        &7奖励速度: &8+&e%us_speed_armor%
        &7  &8&o通过装备护甲和持有
        &7  &8&o护身符来增加你的
        &7  &8&o奖励速度.
    critChance:
      nameItem: '&9暴击几率 &f%us_critchance%%'
      loreItem: |-
        &7暴击几率是你对敌人
        &7造成额外伤害的几率.
        &7
        &7基础暴击几率: &a%us_critchance_simple%%
        &7  &8&o通过升级你的战斗技能
        &7  &8&o和 &d仙女&8&o 来增加你的
        &7  &8&o基础暴击几率.
        &7
        &7奖励暴击几率: &8+&e<critchance_armor>%
        &7  &8&o通过装备护甲和持有
        &7  &8&o护身符来增加你的
        &7  &8&o奖励暴击几率.
    critDamage:
      nameItem: '&9暴击伤害 &f%us_critdamage%%'
      loreItem: |-
        &7暴击伤害是你在暴击时
        &7造成的额外伤害量.
        &7
        &7基础暴击伤害: &a%us_critdamage_simple%%
        &7  &8&o通过探索世界来
        &7  &8&o增加你的基础暴击伤害!
        &7
        &7奖励暴击伤害: &8+&e<critdamage_armor>%
        &7  &8&o通过装备护甲和持有
        &7  &8&o护身符来增加你的
        &7  &8&o奖励暴击伤害.
    intelligence:
      nameItem: '&b情报 &f%us_intelligence%'
      loreItem: |-
        &7情报可以增加你的法力值
        &7上限和魔法物品的
        &7伤害.
        &7
        &7基础情报: &a%us_intelligence_simple%
        &7  &8&o通过升级你的附魔和
        &7  &8&o炼金技能来增加你的
        &7  &8&o基础情报.
        &7
        &7奖励情报: &8+&e%us_intelligence_armor%
        &7  &8&o通过装备护甲和持有
        &7  &8&o护身符来增加你的
        &7  &8&o奖励情报.
        &7
