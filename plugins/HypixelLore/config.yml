            #拾取#
##启用拾取时添加物品描述
pick-up-enabled: false
##拾取物品的描述文本
pick-up-lore: '&f&l常见'

            #背包#
inventory-open-enabled: true
inventory-open-lore: '&f&l常见'
inventory-click-enabled: true
inventory-click-lore: '&f&l常见'

            #烹饪#
##启用烹饪时添加物品描述
cooking-enabled: true
##烹饪物品的描述文本
cooking-lore: '&f&l常见'

            #酿造#
##启用酿造时添加物品描述
brew-enabled: true
##酿造物品的描述文本
brew-lore: '&f&l常见'

            #合成#
##启用合成时添加物品描述
crafting-enabled: true
##合成物品的描述文本
crafting-lore: '&f&l常见'

##为下列合成物品启用不可破坏标记
unbreaking-enabled: true

##在合成后于物品描述后添加物品名称（crafting-lore+物品名）
item-name-enabled: true

