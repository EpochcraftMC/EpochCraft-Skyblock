      usage: '&a请使用 &b/strength <数量> &a并手持一件物品'
      strength: '&a已向你的物品添加 &c[strength] 强度'
   damage:
      name: '伤害'
      permission: 'specialitems.adddamage'
      usage: '&a请使用 &b/damage <数量> &a并手持一件物品'
      damage: '&a已向你的物品添加 &c[damage] 伤害'
