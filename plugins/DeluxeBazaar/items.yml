# 可出售的普通物品（格式为 ITEM-DATA。例如 LOG-2 就是白桦原木）
# 你只需要写出 data 值不同的物品。
# 你可以把物品的 name 设为材质名，这样就不需要在这里写了。
# 示例：COBBLESTONE 的 data 为 0，所以你可以用材质名作为物品名。
# items:
#   COBBLESTONE: （物品名）
normalItems:
  INK_SACK-0: INK
  INK_SACK-4: LAPIS_LAZULI
  INK_SACK-3: COCOA
  LOG-0: OAK_LOG
  LOG-1: SPRUCE_LOG
  LOG-2: BIRCH_LOG
  LOG-3: JUNGLE_LOG
  LOG_2-0: ACACIA_LOG
  LOG_2-1: DARK_OAK_LOG
  RAW_FISH-0: RAW_FISH
  RAW_FISH-1: SALMON
  RAW_FISH-2: CLOWNFISH
  RAW_FISH-3: PUFFERFISH
  NETHER_STALK-0: NETHER_WART
  NETHER_WARTS-0: NETHER_WART
  NETHER_WART-0: NETHER_WART
  SUGAR_CANE_BLOCK-0: SUGAR_CANE
  SUGAR_CANE-0: SUGAR_CANE
  CROPS-0: WHEAT

