#
# 如果你有任何问题或建议，请联系我。
# Discord: SedatTR#8666
# Discord 服务器: https://discord.gg/nchk86TKMT
# Wiki: https://sedattr.gitbook.io/deluxebazaar
# 如果你正在使用此插件，即表示你接受服务条款。

# 如果默认配置不工作，是因为这些配置是在旧版本中创建的。
# 请为你的服务器版本修复配置中的物品。
config:
  buyOrder:
    limitEnabled: true # 启用或禁用限制。
    topOrderLimit: 1.0 # 如果收购单价格上涨超过此数字，将改变价格。（设为 0 禁用）
    maximumCount: 1600 # 每个收购单的最大物品数量。
    minimumPrice: 0.1 # 收购单最低价格。
    requiredCount: 1 # 如果收购单价格数量为 2 或更多，将改变价格。
    checkWhenCreated: true # 如果创建新的收购单，将像购买/出售物品时一样检查订单。

  sellOffer:
    limitEnabled: true
    bestOfferLimit: 1.0
    maximumCount: 1600
    minimumPrice: 0.1
    requiredCount: 1
    checkWhenCreated: true

  addons:
    PlaceholderAPI: false # 用于集市占位符。
    HeadDatabase: false # 用于在物品中使用 HDB 头颅。
    MMOItems: false # 目前仅适用于 PREMIUM 版本。

  default:
    main:
      flags: # 主菜单物品的物品标记。（包括所有物品）
        - HIDE_ENCHANTS
        - HIDE_ATTRIBUTES
    economy:
      type: "vault" # vault 或 yaml
      yaml:
        folder: "plugins/YAMLEconomy/players"
        file: "%uuid%.yml" # %uuid% 或 %player%
        node: money.total # 在文件中: money -> total: 100
    input:
      type: "anvil" # 输入菜单类型，为了更好的性能我推荐 anvil。（sign 或 anvil）
      sign:
        lines: # 告示牌的行，不要使用颜色代码。
          - ""
          - "^^^^^^^^^^"
          - "写入"
          - "数字"
    category: "mining" # 默认分类名称。
    mode: "direct" # 默认模式名称。
    sellNormalItems: true # 如果你想出售普通的 Minecraft 物品，请启用。（不是从集市购买的）
    maximumNumber: 2304 # 如果你不知道，请不要更改。
    limitSellPrice: true # 如果此设置为 true，出售价格将始终低于购买价格。
    buyGoBack: false # 启用后，购买东西时将关闭（返回）购买菜单。
    sellGoBack: true # 禁用后，出售东西时将不关闭（返回）出售菜单。
    settings:
      order: true # 启用或禁用订单。
      orderSettings: true # 启用或禁用订单设置。
      sellAll: true # 启用或禁用全部出售。
      sellItems: true # 启用或禁用物品出售。
      items:
        enabled: true # 如果你不想在创建购买或出售订单时改变价格，请禁用此项。

        change: true # 如果你不想通过公式和重载改变价格，请禁用此项。
        reload: 60 # 物品和数量的重新加载时间，单位分钟。
        buyPrice:
          maximumChange: 1.0 # 最大价格变化（即使公式变化 +5，插件也会最多变化 +1。仅用于增加或减少）
          minimumCount: 1000 # 如果购买数量少于这个数字，价格将不会改变。（设为 0 禁用）
          formula: "%oldprice% + (%buycount% / 100)" # 新价格的公式。（%oldprice% 和 %buycount%）
          type: "increase" # increase、set 或 decrease
        sellPrice:
          maximumChange: 1.0
          minimumCount: 1000
          formula: "%oldprice% + (%sellcount% / 100)"
          type: "decrease"

  messages: # 所有消息。
    noPermission: "&c你没有足够的权限。"
    consoleUsage: "&8- &a/bazaar reload: &7重新加载插件。"
    playerUsage:
      - "&8- &a/bazaar menu: &7打开集市菜单。"
      - "&8- &a/bazaar buy [物品] [数量]: &7购买物品。"
      - "&8- &a/bazaar sell [物品] [数量]: &7出售物品。"
    adminUsage:
      - "&8- &a/bazaaradmin menu [玩家]: &7为玩家打开集市菜单。"
      - "&8- &a/bazaaradmin buy [玩家] [物品] [数量]: &7为玩家购买物品。"
      - "&8- &a/bazaaradmin sell [玩家] [物品] [数量]: &7为玩家出售物品。"
      - "&8- &a/bazaaradmin createitem [名称] [分类]: &7自动创建你手中的物品并添加到文件。"
      - "&8- &a/bazaaradmin reload: &7重新加载插件。"
    buyUsage: "&c购买用法: &f/bazaar buy [物品] [数量]"
    sellUsage: "&c出售用法: &f/bazaar sell [物品] [数量]"
    adminMenuUsage: "&c菜单用法: &f/bazaaradmin menu [玩家]"
    adminBuyUsage: "&c购买用法: &f/bazaaradmin buy [玩家] [物品] [数量]"
    adminSellUsage: "&c购买用法: &f/bazaaradmin sell [玩家] [物品] [数量]"
    notPlayer: "&c你不是玩家！"
