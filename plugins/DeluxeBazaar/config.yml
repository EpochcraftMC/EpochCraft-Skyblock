    bought: "&6集市！ &7以 &6%price% 金币&7 购买了 &a%count%&7x &f%item%&7！"
    sold: "&6集市！ &7以 &6%price% 金币&7 出售了 &a%count%&7x &f%item%&7！"
    soldAll: "&6集市！ &7共以 &6%price% 金币&7 出售了 &a%count%&7x 物品&7！"
    writeNumber: "&a输入数字"
    bigNumber: "&c输入更小的数字"
    reachedMinimumBuyPrice: "&c这个物品已经达到最低购买价格了！"
