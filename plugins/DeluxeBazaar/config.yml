    minimumCount: "&c数量最少需要输入 1！"
    noStock: "&c无"

  permissions: # 如果你想禁用，请写 ""。
    menu:
      # 如果玩家拥有此权限，可以在主菜单中看到此物品。（也可以购买和出售此物品）
      # 你可以使用 %item% 占位符。
      item: ""

      # 如果玩家拥有此权限，可以在主菜单中看到此分类。
      # 你可以使用 %category% 占位符。
      category: ""
    normal: # 普通命令
      command: "" # /bazaar
      menu: "" # /bazaar menu
      buy: "" # /bazaar buy [物品] [数量]
      sell: "" # /bazaar sell [物品] [数量]
    admin: # 管理员命令
      command: "bazaaradmin.command" # /bazaaradmin
      menu: "bazaaradmin.menu" # /bazaaradmin menu [玩家]
      buy: "bazaaradmin.buy" # /bazaaradmin buy [玩家] [物品] [数量]
      sell: "bazaaradmin.sell" # /bazaaradmin sell [玩家] [物品] [数量]
      createItem: "bazaaradmin.createitem" # /bazaaradmin createitem [名称] [分类]
      reload: "bazaaradmin.reload" # /bazaaradmin reload

number: # 价格的数字格式。
  removeDecimal: false # 如果为 true，数字将没有小数。（例如 43.34 变成 43）
  minimumFraction: 0
  maximumFraction: 2
  decimal: true # 10,2 等。
  short: # 10k、25M、1T 等。（我不推荐，目前有点小问题。）
    enabled: false
    thousand: "k"
    million: "M"
    billion: "G"
    trillion: "T"
    quadrillion: "Q"
    quintillion: "E"

