#使用 m 代表分钟，h 代表小时，d 代表天，数字和时间单位之间用空格隔开
#最大拍卖时间为 7 天，你不能将拍卖设置为秒
#如果你输入的时间不正确，将重置为 2 小时
default-starting-duration: '2 h'

#时间的自定义单位
#不要在上面的选项中使用这些，它们仅可用于
#拍卖消息中，在配置中请使用上方注释中的语法
second: '秒'
seconds: '秒'
minute: '分钟'
minutes: '分钟'
hour: '小时'
hours: '小时'
day: '天'
days: '天'

#时间单位的简写:
short_second: '秒'
short_minute: '分'
short_hour: '时'
short_day: '天'


#这是计算小时费用的公式
#x=小时数
extra-fee-formula: '5*(x+3)+5*x*(Math.floor(x/9)+Math.floor(x/20))'
#分钟的费用是固定的（5 分钟 - 59 分钟）
extra-fee-minutes: '500'

