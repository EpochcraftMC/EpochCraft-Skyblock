#使用 'none' 表示没有声音
#声音列表 - https://helpch.at/docs/version/index.html?org/bukkit/Sound.html
#将 version 替换为你的服务器版本^
#使用示例 (1.8.8): https://helpch.at/docs/1.8.8/index.html?org/bukkit/Sound.html
#ah-command: 'ORB_PICKUP"

#---------命令声音---------------
#/ah 的声音
ah-command: 'none'
#/ah <玩家> 的声音
ah-player: 'none'
#/ah delivery 的声音
ah-delivery-command: 'none'

#---------通用声音---------------
#点击 NPC 的声音
