    Permission: "none"
    Material: "FEATHER"
    Custom-model-data: 0
    Displayname: "&a参观岛屿"
    Lore:
    - "&e点击参观！"
    Close-on-click: true
    Commands:
    - "islandvisit {TARGET}"
  trade-request:
    Slot: 16
    Permission: "none"
    Material: "EMERALD"
