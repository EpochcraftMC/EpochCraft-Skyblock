Display:
  Text:
  - '&8[&7{Mob_Name}&8] &c{Mob_Type} {DynamicColor}{Health_0}&f/&a{MaxHealth_0}&c❤'
  DynamicColorSettings:
    HealthyColor: '&a'
    HalfColor: '&e'
    LowColor: '&c'
  ScaledSymbolSettings:
    Scale: 10
    DynamicScale: true
    HealthyChar: '&c❤'
    HalfChar: '&e❤'
    EmptyChar: '&7❤'
Options:
  AlwaysShow: true
  ApplyToNamed: true
  DisabledWorlds:
  - Islands
  DisabledMobTypes:
  - ENDER_DRAGON
  - Bat
  DisabledMobNamesAbsolute: []
  DisabledMobNamesContains:
  - Dragon
  DynamicHealthDisplay:
    Use: false
    Timeout: 3
    OnlyPlayerTrigger: false
  Range:
    Use: true
    Distance: 30
    UpdateRate: 20
  MultiLine:
    Enable: false
    MasterYOffset: 2
    Special:
    - Name:^Special Name:2
    - Type:ENDERMITE:1
Hooks:
  Citizens:
    ShowNPCMobHealth: false
  MythicMobs:
    ShowMythicMobsHealth: true
  Shopkeepers:
    ShowShopkeepersHealth: true
  MyPet:
    ShowMyPetHealth: false
Messages:
  ReloadPlugin: '&aHoloMobHealth 已重新加载！'
  NoPermission: '&c你没有权限使用该命令！'
  PlayersOnly: '&c此命令只能由玩家执行！'
  PlayerNotFound: '&c该玩家不在线！'
  ToggleDisplayOn: '&a已启用怪物血量显示！'
  ToggleDisplayOff: '&c已禁用怪物血量显示！'
Database:
  Type: SQLITE
  MYSQL:
    Host: localhost
    Port: 3306
    Database: InteractionVisualizer
    Username: mysql
    Password: password
Updater:
  Enable: false
