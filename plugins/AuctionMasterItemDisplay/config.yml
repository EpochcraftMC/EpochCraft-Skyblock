title-line-1: '&e#%top-position% &f%auction-name%'
title-line-2: '&7由 %seller-display-name% 出售'

display-use-permission: 'auctionmaster.display'
no-permission-message: '&c你没有权限使用这个。'

no-auction-display-click-message:
  - '这是一条空白消息'

#告示牌内容有限，你可以
#使用 %position% 代表拍卖位置
#使用 %coins% 代表拍卖金币
#使用 %bids% 代表出价次数
sign-line-1: '&0#%position% 拍卖'
sign-line-2: '&6&l%coins% 金币'
sign-line-3: '&2%bids% 次出价'
sign-line-4: '&3&l[点击玻璃]'

#告示牌上显示的单位
#你可以放多个字母，但请注意
#每行需要有足够的空间
units:
  #1.000 的单位
  first-unit: 'K'
  #1.000.000 的单位
  second-unit: 'M'
  #1.000.000.000 的单位
  third-unit: 'G'
  #1.000.000.000.000 的单位
  forth-unit: 'T'
  #如果你需要更多单位，那你真是疯了

#请勿修改
version: 1.0