###  ImageOnMap 配置文件


# 插件语言。留空: 系统语言。
# 可用: en_US（默认，回退）和 fr_FR。
lang: 


# 允许收集插件环境和使用的匿名统计信息
# 统计数据在此公开可见: http://mcstats.org/plugin/ImageOnMap
collect-data: false


# 渲染在地图上的图片会消耗 Minecraft 地图 ID，而地图 ID 总共只有 32,767 个。
# 你可以限制单个玩家或整个服务器在 ImageOnMap 中可使用的最大地图数量。
# 0 表示无限制。
map-global-limit: 0
map-player-limit: 0
