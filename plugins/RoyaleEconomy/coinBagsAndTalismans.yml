  maximum-amount: 500000
  maximum-message: '&f袋子最多只能装 &650万 硬币&f！再多就要撑破了。'
  money-bag-click: '&f你从一个袋子中收集了 &6%amount% 硬币&f！'
  money-bag-name: '&6硬币袋'
  #Use %amount% for the amount of coins the bag contains
  money-bag-lore:
    - '&7这是一个可以'
    - '&7存放硬币的袋子！'
    - '&7最多可存放 &650万 硬币&7！'
    - ''
    - '&7它装有'
    - '&6%amount% 硬币&7！'
    - ''
    - '&e点击将硬币'
    - '&e添加到你的钱包！'

