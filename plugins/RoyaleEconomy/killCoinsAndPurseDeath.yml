kill-coins:
  disabled-worlds: []
  #Set this to false if you don't want players to
  #receive coins on mob kill
  use-kill-coins: false
  use-maximum-coins: false
  #Use %amount% for the amount of coins gained
  #Use #entity-display% for the name of the entity
  message-on-kill: '&6+%amount% 硬币（%entity-display% 击杀）'
  default-coins: '3'
  default-permission: 'none'
  default-display-name: '&6生物'
  default-message: '&f你因击杀某物获得了 &63 硬币&f！'
  #How much coins can a player get from kills per day
  #If you set this to 0 it will be unlimited, otherwise the player
  #can't get more than the limit you set
  maximum-coins-per-day: 0
  maximum-reached-message:
    - '&c你已达到硬币上限！'
    - '&c你击杀生物不会再获得硬币。'
    - ''
    - '&c明天你将重新开始获得硬币！'
  #If you are using mythic mobs you can hook into it
  #in this section
  mythic-mobs-events:
    #The name of this setting must be a mob from MythicMobs
    SkeletalMinion:
      #Permission to get coins from killing this entity
      #Set to none if u want everyone to be able to get coins
      permission: 'none'
      display-name: '&a骷髅仆从'
      coins-to-give: '10-15'
      #After you kill the maximum number you
      #won't receive any more coins for killing this entity
      #set 0 for no limit
      maximum-kills: 1000
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀该神话生物不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
  #kill events based on entity types
  kill-events:
    #The list of entity types: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
    event1:
      entity-type: 'PLAYER'
      #Permission to get coins from killing this entity
      #Set to none if u want everyone to be able to get coins
      permission: 'none'
      display-name: '&c玩家'
      coins-to-give: '15'
      #After you kill the maximum number you
      #won't receive any more coins for killing this entity
      #set 0 for no limit
      maximum-kills: 1000
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀玩家不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
    event2:
      entity-type: 'ZOMBIE'
      permission: 'none'
      display-name: '僵尸'
      coins-to-give: '5-10'
      maximum-kills: 0
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀僵尸不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
    event3:
      entity-type: 'SKELETON'
      permission: 'none'
      display-name: '骷髅'
      coins-to-give: '10-25'
      maximum-kills: 0
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀骷髅不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
    event4:
      entity-type: 'BLAZE'
      permission: 'none'
      display-name: '烈焰人'
      coins-to-give: '70-100'
      maximum-kills: 0
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀骷髅不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
    event5:
      entity-type: 'SILVERFISH'
      permission: 'none'
      display-name: '蠹虫'
      coins-to-give: '25-35'
      maximum-kills: 0
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀骷髅不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
    event6:
      entity-type: 'SPIDER'
      permission: 'none'
      display-name: '蜘蛛'
      coins-to-give: '20-30'
      maximum-kills: 0
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀骷髅不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
    event6:
      entity-type: 'MAGMA_CUBE'
      permission: 'none'
      display-name: '岩浆怪'
      coins-to-give: '60-80'
      maximum-kills: 0
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀骷髅不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'
  #kill events based on entity name
  #has priority over entity type
  custom-kill-events:
    event1:
      entity-name: '&a自定义生物名称'
      #Permission to get coins from killing this entity
      #Set to none if u want everyone to be able to get coins
      permission: 'none'
      display-name: '&a自定义生物'
      coins-to-give: '15'
      #After you kill the maximum number you
      #won't receive any more coins for killing this entity
      #set 0 for no limit
      maximum-kills: 1000
      maximum-reached-message:
        - '&c你已达到击杀上限！'
        - '&c你击杀自定义生物不会再获得硬币。'
        - ''
        - '&c明天你将重新开始获得硬币！'



purse-coins-handle:
  disabled-worlds: []
  bypass-permission: 'rec.bypass.purse.death'
  #Set this to false if you don't want players to
  #lose coins on death
  use-purse-coins-death: true
  #If you enable this setting the amount of coins the player loses
  #will be dropped at the death place as a coins bag
  drop-coins-bag-at-death-place: false
  #If the player loses less than this value
  #the bag won't be generated (Only if drop-coins-bag-at-death-place is true)
  minimum-coins-for-bag: 2000
  #Use numbers from 0 to 100 for percents
  default-percent: 50
  default-message: '&c你死了，从钱包中损失了 %coins% 硬币！'
  death-events:
    #Here you can create custom percents for every death cause in the list from the link below
    #If the event is not specified but the use-purse-coins-death is true, it will take
    #the default percent
    #Check death causes at https://hub.spigotmc.org/javadocs/spigot/org/bukkit/event/entity/EntityDamageEvent.DamageCause.html
    event1:
      death-cause: 'ENTITY_ATTACK'
      percent-to-take: 50
      message-to-give: '&c你被生物/玩家击杀，损失了 %coins% 硬币。'
    event2:
      death-cause: 'VOID'
      percent-to-take: 50
      message-to-give: '&c你掉入虚空，损失了 %coins% 硬币。'
