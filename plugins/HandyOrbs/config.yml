#在控制台中记录玩家活动
#示例: 放置宝珠、捡起宝珠、编辑名称、重置名称
#使用超活跃模式、将宝珠转换为服务器宝珠
use-logger: true

#如果设置为 true，宝珠将停止上下浮动
#只进行旋转
orb-rotate-only: true

#使用合成配方将农耕宝珠转换
#为另一种农耕宝珠
use-crafting-recipes: false

#通过命令 /handyorbs 或 /handyorbs <玩家> 打开菜单所需的权限
open-own-orbs-menu-permission: 'none'
open-other-orbs-menu-permission: 'handyorbs.menu.open.other'

#通过命令 /handyorbs get 打开菜单所需的权限
open-get-menu-permission: 'handyorbs.admin.orbs'

#命令 /handyorbs give <玩家> <宝珠> 所需的权限
give-permission: 'handyorbs.give.orbs'

#/handyorbs 描述:
handyorbs-description: ' &7- &f打开自己的宝珠菜单'
#/handyorbs <玩家> 描述
handyorbs-player-description: ' &7- &f打开其他玩家的宝珠菜单'
#/handyorbs get 描述
handyorbs-get-description: ' &7- &f从管理员菜单获取宝珠'
#/handyorbs give 描述
handyorbs-give-description: ' &7- &f将宝珠给予其他玩家'

given-orb-message: '&a宝珠已给予 %player%！'
no-permission-message: '&c你没有权限使用这个。'
can-not-find-player-message: '&c我找不到那个玩家...'
player-has-no-orbs: '&c那个玩家没有任何宝珠。'

#这是玩家放置宝珠后
#宝珠显示的名称
#使用 %owner% 显示玩家的用户名
#使用 %owner-display-name% 显示玩家的显示名
#使用 %orb-name% 显示宝珠的名称
#注意！%owner% 必须包含在内！！
orb-with-owner-display-name: '&f%owner% 的 %orb-name%'

not-enough-space-to-place: '&c你只能在空方块上方放置宝珠。'

#宝珠周围 3 格范围内不能放置另一个宝珠
other-orb-too-near: '&c你不能把宝珠放在离另一个宝珠太近的地方。'

#只有宝珠的主人才能捡起宝珠/进入宝珠的菜单
#但如果你拥有下面的权限就可以绕过这个限制
bypass-claim-permission: 'handyorbs.bypass.owner'
can-not-claim-message: '&c你不能与别人的宝珠互动！'

#-----------------限制宝珠数量帮助---------------------------
#限制玩家可以拥有的宝珠数量
#每种宝珠最多 7 个
#但你可以进一步限制
#给玩家权限来限制他们的宝珠
#通用权限: handyorbs.limit.type.number
#其中 type 是类别，number 是宝珠上限
#示例:
#handyorbs.limit.wheat.3 - 玩家总共可以拥有 3 个小麦宝珠
#handyorbs.limit.carrots.3
#handyorbs.limit.sugar-cane.3
#handyorbs.imit.nether-wart.2
#handyorbs.limit.fishing.3 - 玩家总共可以拥有 3 个钓鱼宝珠
#handyorbs.limit.rainbow.2 - 玩家总共可以拥有 3 个彩虹宝珠
orb-limit-reached-message: '&c你已达到该类别的宝珠上限，不能再放置这种宝珠了！'

#如果玩家是管理员（拥有管理员宝珠使用权限）
#当他们达到上限时，宝珠仍然会被放置
#但它将归属于服务器
extra-admin-limit-reach-message: '&f因为你是管理员，你的宝珠变成了 &c服务器宝珠&f！'

